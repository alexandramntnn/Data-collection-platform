<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/add_house.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <!-- sidebar -->
    <div class="sidebar" id="sidebar">
        <a href="{{ url_for('dashboard') }}"><i class="fas fa-home"></i> Dashboard overview</a>
        <a href="{{ url_for('visualize_data') }}"><i class="fas fa-chart-line"></i> Visualize data</a>
        <a href="{{ url_for('upload') }}"><i class="fas fa-upload"></i> Upload data</a>
        <a href="{{ url_for('download') }}"><i class="fas fa-download"></i> Download data</a>
        <a href="{{ url_for('profile') }}"><i class="fas fa-user"></i> Profile</a>
        <a href="{{ url_for('faq') }}"><i class="fas fa-question-circle"></i> FAQ</a>
        <a href="{{ url_for('settings') }}"><i class="fas fa-cog"></i> Settings</a>
        <a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>

    <!-- main -->
    <div class="dashboard-content">
        <h1>Add a new property</h1>

        <!-- form for adding new property -->
        <form method="post" action="{{ url_for('add_house') }}">
            <!-- error messages -->
            {% if error_messages %}
            <div class="error-messages">
                <ul>
                    {% for error in error_messages %}
                    <li class="error">{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}

            <!-- form fields -->
            <label for="house_name">Property name:</label>
            <input type="text" id="house_name" name="house_name" required>

            <label for="type_of_area">Type of area:</label>
            <select id="type_of_area" name="type_of_area" required>
                <option value="Urban">Urban</option>
                <option value="Suburban">Suburban</option>
                <option value="Rural">Rural</option>
            </select>

            <label for="house_type">Property type:</label>
            <select id="house_type" name="house_type" required>
                <option value="Detached">Detached</option>
                <option value="Semi-detached">Semi-detached</option>
                <option value="Apartment">Apartment</option>
            </select>

            <label for="house_size">Property size:</label>
            <select id="house_size" name="house_size" required>
                <option value="0-50">0-50 m²</option>
                <option value="51-75">51-75 m²</option>
                <option value="76-100">76-100 m²</option>
                <option value="101-150">101-150 m²</option>
                <option value="151-200">151-200 m²</option>
                <option value="201-250">201-250 m²</option>
                <option value=">250">>250 m²</option>
            </select>

            <label for="insulation_level">Insulation level:</label>
            <select id="insulation_level" name="insulation_level" required>
                <option value="None">None</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>

            <label for="occupants">Number of occupants:</label>
            <select id="occupants" name="occupants" required>
                <option value="1-2">1-2 occupants</option>
                <option value="3-4">3-4 occupants</option>
                <option value="5+">5+ occupants</option>
            </select>

            <label for="occupancy_patterns">Occupancy patterns:</label>
            <select id="occupancy_patterns" name="occupancy_patterns" required>
                <option value="Mostly home during the day">Mostly home during the day</option>
                <option value="Mostly away during the day">Mostly away during the day</option>
            </select>

            <label for="solar_capacity">Solar panel capacity (kW):</label>
            <input type="number" id="solar_capacity" name="solar_capacity" step="0.1" min="0">

            <label for="location">Location:</label>
            <input type="text" id="location" name="location" placeholder="Enter location">

            <!-- Google Maps autocomplete -->
            <script
                src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCwuL-ywPq7cF6wzzpcXAoAUNyV2N4YAH8&libraries=places&callback=initAutocomplete"
                async defer></script>
            <script>
                function initAutocomplete() {
                    const input = document.getElementById('location');
                    const autocomplete = new google.maps.places.Autocomplete(input, { types: ['geocode'] });

                    autocomplete.addListener('place_changed', function () {
                        const place = autocomplete.getPlace();
                        if (!place.geometry) {
                            console.error("No geometry available for selected place.");
                        }
                    });
                }

                function validateForm(event) {
                    const locationInput = document.getElementById('location');
                    if (!locationInput.value.trim()) {
                        alert("Please select a valid location.");
                        locationInput.focus();
                        event.preventDefault();
                    }
                }

                document.querySelector('form').addEventListener('submit', validateForm);
            </script>

            <!-- button -->
            <button type="submit">Add property</button>
        </form>
    </div>
</body>

</html>
